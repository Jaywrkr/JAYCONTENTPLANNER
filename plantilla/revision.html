<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Revisión Semanal</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--fg:#0a0a0a;--dim:#7a7a7a;--rule:#d9d9d9;--soft:#f0f0f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f2f2f2;--dim:#8a8a8a;--rule:#2a2a2a;--soft:#151515}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f2f2f2;--dim:#8a8a8a;--rule:#2a2a2a;--soft:#151515}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Geist Mono",ui-monospace,monospace;font-weight:300;font-size:14px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 18px;border-bottom:1px solid var(--rule)}
.brand{font-size:15px;font-weight:400}.brand span{color:var(--dim)}
.lab{font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
h1{font-weight:300;font-size:28px;line-height:1.15;padding:22px 0 4px}
.sub{color:var(--dim);font-size:13px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:20px;border-top:1px solid var(--rule)}
.kpi{padding:14px 0;border-bottom:1px solid var(--rule)}
.kpi:nth-child(odd){padding-right:12px;border-right:1px solid var(--rule)}.kpi:nth-child(even){padding-left:12px}
.kpi .v{font-size:24px;padding-top:4px}.kpi .t{font-size:11px;color:var(--dim)}
.tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.tbl th{font-weight:400;text-align:right;color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--rule)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
.tbl tr.top td{font-weight:400}
.scroll{overflow-x:auto}
section{padding-top:28px}
h2{font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase}
ol.list{list-style:none;margin-top:10px}
ol.list li{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--rule);font-size:13px}
ol.list li:last-child{border-bottom:1px solid var(--rule)}
ol.list .n{color:var(--dim);font-size:12px}
.tabs{display:flex;gap:16px;overflow-x:auto;padding:14px 0;border-bottom:1px solid var(--rule)}
.tabs button{font:inherit;background:none;border:0;color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--fg);text-decoration:underline;text-underline-offset:4px}
.empty{padding:40px 0;color:var(--dim)}
footer{padding:40px 0 10px;text-align:center;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">jay <span>/</span> revisión</div><span class="lab" id="upd"></span></header>
  <div class="tabs" id="tabs"></div>
  <main id="main"><div class="empty">Cargando…</div></main>
  <footer>simple.</footer>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const fmt = n => n == null || n === '' ? '—' : typeof n === 'number' ? n.toLocaleString('es') : esc(n);
let weeks = [], cur = 0;
function render() {
  const T = $('tabs'), M = $('main');
  if (!weeks.length) { T.innerHTML = ''; M.innerHTML = '<div class="empty">Aún no hay revisiones guardadas.</div>'; return; }
  T.innerHTML = weeks.map((w, i) => `<button class="${i === cur ? 'on' : ''}" data-i="${i}">${esc(w.label)}</button>`).join('');
  const w = weeks[cur];
  $('upd').textContent = w.fecha ? 'Revisado ' + esc(w.fecha) : '';
  M.innerHTML = `
    <h1>${esc(w.titular)}</h1><div class="sub">${esc(w.rango)}</div>
    <div class="kpis">${(w.kpis || []).map(k => `<div class="kpi"><div class="lab">${esc(k.n)}</div><div class="v">${fmt(k.v)}</div><div class="t">${esc(k.t || '')}</div></div>`).join('')}</div>
    <section><h2>Posts del feed</h2><div class="scroll"><table class="tbl"><thead><tr><th>Post</th><th>Vistas</th><th>Compart.</th><th>Guard.</th><th>Seguid.</th><th>C+G/1K</th></tr></thead><tbody>
      ${(w.posts || []).map(p => `<tr class="${p.top ? 'top' : ''}"><td>${esc(p.d)}<br><span class="lab">${esc(p.s)}</span></td><td>${fmt(p.v)}</td><td>${fmt(p.sh)}</td><td>${fmt(p.sv)}</td><td>${fmt(p.f)}</td><td>${fmt(p.r)}</td></tr>`).join('')}
    </tbody></table></div></section>
    <section><h2>Lo que dicen los datos</h2><ol class="list">${(w.hechos || []).map((h, i) => `<li><span class="n">${String(i + 1).padStart(2, '0')}</span><span>${esc(h)}</span></li>`).join('')}</ol></section>
    <section><h2>Qué cambiamos</h2><ol class="list">${(w.cambios || []).map((h, i) => `<li><span class="n">${String(i + 1).padStart(2, '0')}</span><span>${esc(h)}</span></li>`).join('')}</ol></section>
    <section><h2>Próxima revisión</h2><div class="sub" style="padding-top:8px">${esc(w.proxima || '')}</div></section>`;
}
$('tabs').onclick = e => { const b = e.target.closest('button'); if (b) { cur = +b.dataset.i; render(); } };
render();
(async () => {
  try {
    const db = window.claude ? await claude.use('db') : null;
    if (!db) { $('main').innerHTML = '<div class="empty">Abre esta página desde Claude para ver las revisiones.</div>'; return; }
    db.collection('semanas').onSnapshot(snap => {
      const docs = (snap.docs || []).map(d => d.data ? d.data() : d);
      weeks = docs.filter(Boolean).sort((a, b) => String(b.id || b.rango).localeCompare(String(a.id || a.rango)));
      cur = 0; render();
    }, () => { $('main').innerHTML = '<div class="empty">No se pudieron cargar las revisiones.</div>'; });
  } catch (e) { $('main').innerHTML = '<div class="empty">No se pudieron cargar las revisiones.</div>'; }
})();
</script>
</body>
</html>
